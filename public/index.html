<!doctype html>
<html lang="he" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Admondo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span id="clock">9:41</span>
      <span class="notch"></span>
      <span class="sb-icons">
        <svg viewBox="0 0 18 12" width="18" height="12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 16 12" width="16" height="12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0zM3.5 7a6.4 6.4 0 0 1 9 0l-1.4 1.4a4.4 4.4 0 0 0-6.2 0zM1 4.5a10 10 0 0 1 14 0l-1.4 1.4a8 8 0 0 0-11.2 0z"/></svg>
        <svg viewBox="0 0 27 13" width="27" height="13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2.5" y="2.5" width="19" height="8" rx="2"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" opacity=".5"/></svg>
      </span>
    </div>

    <main id="view" class="view"></main>

    <nav class="tabbar" id="tabbar">
      <button data-nav="home" class="tab"><i data-icon="home"></i><span>בית</span></button>
      <button data-nav="projects" class="tab"><i data-icon="folder"></i><span>פרויקטים</span></button>
      <button id="addBtn" class="tab-add" aria-label="הוסף"><i data-icon="plus"></i></button>
      <button data-nav="tasks" class="tab"><i data-icon="checkCircle"></i><span>משימות</span></button>
      <button data-nav="settings" class="tab"><i data-icon="gear"></i><span>הגדרות</span></button>
    </nav>

    <div id="sheet" class="sheet hidden"></div>
    <div class="homebar"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
